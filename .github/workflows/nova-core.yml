name: NOVA core

on:
  push:
    paths:
      - 'README.md'
      - 'SEEDSPACE.md'
      - 'nova/**'
      - '.github/workflows/nova-core.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'SEEDSPACE.md'
      - 'nova/**'
      - '.github/workflows/nova-core.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile
        run: python -m compileall -q nova/src nova/nova.py
      - name: Unit tests
        env:
          PYTHONPATH: nova/src
        run: python -m unittest discover -s nova/tests -v
      - name: Molecular lineage model and local NOVA bridge
        shell: python
        run: |
          import subprocess, sys
          subprocess.run(['node', '--test', 'nova/labs/molecular-lineage/engine.test.mjs', 'nova/labs/molecular-lineage/app.test.mjs'], check=True)
          subprocess.run([sys.executable, '-X', 'utf8', 'nova/labs/molecular-lineage/test_bridge.py'], check=True)
      - name: Zero-install CLI smoke test
        shell: python
        run: |
          import hashlib, json, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          launcher = str(Path('nova/nova.py').resolve())
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              source = root / 'source.txt'
              source.write_text('source provenance unknown\n', encoding='utf-8')
              commands = [['init', '--name', 'ci-smoke'], ['ingest', str(source), '--tag', 'smoke'],
                          ['run', 'provenance', '--mode', 'FLOW', '--next-seed', 'continue'],
                          ['resume'], ['verify'], ['export', str(root/'export.zip')]]
              for args in commands:
                  subprocess.run([sys.executable, launcher, '--workspace', tmp, *args], check=True)
              with zipfile.ZipFile(root/'export.zip') as archive:
                  assert archive.testzip() is None
                  manifest = json.loads(archive.read('NOVA_EXPORT_MANIFEST.json'))
                  assert '.nova/write.lock' not in archive.namelist()
                  for row in manifest['files']:
                      data = archive.read(row['path'])
                      assert len(data) == row['bytes']
                      assert hashlib.sha256(data).hexdigest() == row['sha256']
      - name: Unix zero-install launcher
        if: runner.os != 'Windows'
        run: ./nova/nova.sh --version
      - name: Windows zero-install launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: nova\nova.cmd --version
      - name: Execute workbench and bound integration
        shell: python
        run: |
          import subprocess, sys, tempfile
          from pathlib import Path
          launcher = str(Path('nova/nova.py').resolve())
          with tempfile.TemporaryDirectory() as tmp:
              for args in [['demo', '--node', 'node'], ['value-flow', 'nova/examples/value-flow.json'], ['verify']]:
                  subprocess.run([sys.executable, launcher, '--workspace', tmp, *args], check=True)
      - name: Source-bound essence continuation
        shell: python
        run: |
          import json, subprocess, sys, tempfile
          from pathlib import Path
          launcher = str(Path('nova/nova.py').resolve())
          with tempfile.TemporaryDirectory() as tmp:
              def run(*args):
                  done = subprocess.run([sys.executable, '-X', 'utf8', launcher, '--workspace', tmp, *args],
                                        check=True, capture_output=True, text=True, encoding='utf-8')
                  return json.loads(done.stdout)
              run('init', '--name', 'essence-ci')
              first = run('essence-farm', 'nova/examples/essence-nova-reviewed.json')
              farm = first['result']['essence_farms'][0]
              assert len(farm['branches']) == 10
              assert len(farm['comparisons']) == 45
              assert len(farm['candidate_essences']) == 1
              second = run('work', 'NOVA erinnert mich an frühere Spuren', '--mode', 'DEEP')
              assert any(question['prior_occurrences'] for question in second['result']['unknowns'])
              assert run('verify')['ok']
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==13.0.0' 'av==19.0.2' 'pypdf==6.21.2'
      - name: Optional media consumers
        env:
          PYTHONPATH: nova/src
        run: python -m unittest discover -s nova/tests -v
