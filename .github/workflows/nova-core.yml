name: NOVA core

on:
  push:
    paths:
      - 'nova/**'
      - '.github/workflows/nova-core.yml'
  pull_request:
    paths:
      - 'nova/**'
      - '.github/workflows/nova-core.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q nova/src nova/nova.py
      - name: Unit tests
        env:
          PYTHONPATH: nova/src
        run: python -m unittest discover -s nova/tests -v
      - name: Zero-install CLI smoke test
        shell: python
        run: |
          import hashlib, json, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          launcher = str(Path('nova/nova.py').resolve())
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              source = root / 'source.txt'
              source.write_text('source provenance unknown\n', encoding='utf-8')
              commands = [['init', '--name', 'ci-smoke'], ['ingest', str(source), '--tag', 'smoke'],
                          ['run', 'provenance', '--mode', 'FLOW', '--next-seed', 'continue'],
                          ['resume'], ['verify'], ['export', str(root/'export.zip')]]
              for args in commands:
                  subprocess.run([sys.executable, launcher, '--workspace', tmp, *args], check=True)
              with zipfile.ZipFile(root/'export.zip') as archive:
                  assert archive.testzip() is None
                  manifest = json.loads(archive.read('NOVA_EXPORT_MANIFEST.json'))
                  assert '.nova/write.lock' not in archive.namelist()
                  for row in manifest['files']:
                      data = archive.read(row['path'])
                      assert len(data) == row['bytes']
                      assert hashlib.sha256(data).hexdigest() == row['sha256']
      - name: Unix zero-install launcher
        if: runner.os != 'Windows'
        run: ./nova/nova.sh --version
      - name: Windows zero-install launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: nova\nova.cmd --version
