[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halveth-nova"
version = "2.0.1"
description = "Source-bound research, structural retrieval and bounded executable builds for HALVETH/LUCINET"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Juri Janovski / Juri-Halveth"}]
license = {text = "LicenseRef-HALVETH-PIRL-2.0"}
keywords = ["provenance", "research", "continuity", "search", "ledger", "halveth", "lucinet"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
nova = "halveth_nova.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
halveth_nova = ["workbench/_integrations/lagefaden/*"]
